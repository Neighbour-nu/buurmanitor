<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titel %}Buurmanitor{% endblock %}</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/static/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/style.css?v=31">
{% block kop %}{% endblock %}
</head>
<body>
<header class="kop">
  <a class="merk" href="/" aria-label="Buurmanitor, naar Vandaag">
    <img src="/static/logo.svg" alt="" width="40" height="40">
    <span class="naam">BUURMANITOR</span>
  </a>
  <nav class="menu" aria-label="Hoofdmenu">
    <a href="/" class="{{ 'actief' if scherm == 'vandaag' }}">Vandaag<span id="teller" class="teller" hidden></span></a>
    <a href="/iris" class="{{ 'actief' if scherm == 'iris' }}">Iris</a>
    <a href="/clara" class="{{ 'actief' if scherm == 'clara' }}">Agenda</a>
    <a href="/taken" class="{{ 'actief' if scherm == 'taken' }}">Taken</a>
    <a href="/bram" class="{{ 'actief' if scherm == 'bram' }}">Post</a>
    <a href="/vera" class="{{ 'actief' if scherm == 'vera' }}">Nieuws</a>
    <a href="/jesse" class="{{ 'actief' if scherm == 'jesse' }}">Socials</a>
    <span class="scheiding" aria-hidden="true"></span>
    {% for w in werkruimtes %}<a href="{{ w.url }}">{{ w.naam }}</a>{% endfor %}
  </nav>
  <div class="wie">{{ gebruiker }}</div>
</header>
<div id="banner" class="banner" hidden></div>
<main class="{% block main_klasse %}{% endblock %}">{% block inhoud %}{% endblock %}</main>
<footer class="voet">
  <a href="/gezondheid">Gezondheid</a>
  <a href="{{ auth_url }}/logout">Uitloggen</a>
</footer>
<script>
// Na Stuur (of Ctrl/Cmd-Enter): vraagveld op slot, knop uit en laten zien dat het antwoord eraan komt.
(function () {
  const stijl = document.createElement("style");
  stijl.textContent = ".bezig-veld{opacity:.6;cursor:progress}" +
    ".draaier{display:inline-block;width:.8em;height:.8em;border:2px solid currentColor;border-right-color:transparent;" +
    "border-radius:50%;animation:draai .8s linear infinite;vertical-align:-1px;margin-right:4px}" +
    "@keyframes draai{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.draaier{animation:none}}" +
    ".bezig-melding{margin-left:8px}";
  document.head.appendChild(stijl);
  document.addEventListener("submit", function (e) {
    const f = e.target, veld = f.querySelector('textarea[name="vraag"]');
    if (!veld) return;
    if (f.dataset.bezig) { e.preventDefault(); return; }  // niet twee keer versturen
    if (!veld.value.trim()) return;
    f.dataset.bezig = "1";
    f.setAttribute("aria-busy", "true");
    veld.readOnly = true;  // readOnly en niet disabled: anders wordt de vraag niet meegestuurd
    veld.classList.add("bezig-veld");
    const knop = e.submitter || f.querySelector('button[type="submit"], button:not([type])');
    if (knop) {
      setTimeout(function () { knop.disabled = true; }, 0);  // na het versturen, zodat de knop zelf nog meegaat
      knop.innerHTML = '<span class="draaier" aria-hidden="true"></span>Bezig';
    }
    const m = document.createElement("span");
    m.className = "bezig-melding noot"; m.setAttribute("role", "status");
    m.textContent = "Even geduld, het antwoord komt eraan. Dit kan een halve minuut duren.";
    (knop || veld).insertAdjacentElement("afterend", m);
  }, true);
  // Terug met de vorige-knop van de browser: formulier weer bruikbaar
  window.addEventListener("pageshow", function (e) { if (e.persisted) location.reload(); });
})();
// Ctrl-Enter (of Cmd-Enter op een Mac) in een vraagveld verstuurt de vraag.
document.addEventListener("keydown", function (e) {
  const veld = e.target;
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey) && veld.tagName === "TEXTAREA" && veld.form && veld.name === "vraag") {
    e.preventDefault();
    if (veld.value.trim()) veld.form.requestSubmit ? veld.form.requestSubmit() : veld.form.submit();
  }
});
// Afspraken die voorbij zijn grijs maken, ook als de pagina openblijft (elke minuut bijwerken).
(function () {
  function bij() {
    const nu = Date.now();
    document.querySelectorAll(".afspraak[data-eind]").forEach(a => a.classList.toggle("voorbij", Date.parse(a.dataset.eind) <= nu));
  }
  bij(); setInterval(bij, 60000);
})();
// Meldingen: elke 30 seconden kijken of er iets nieuws is. Urgent en belangrijk verschijnen als banner en,
// als je dat toestaat, als systeemmelding op je scherm (ook als dit tabblad op de achtergrond staat).
(function () {
  let na = Number(sessionStorage.getItem("melding_na") || 0), eerste = !sessionStorage.getItem("melding_na");
  function toon(m) {
    const b = document.getElementById("banner");
    b.className = "banner " + m.niveau; b.hidden = false;
    b.innerHTML = "<b></b> <span></span> <a href='" + (m.link && m.link.startsWith('/') ? m.link : '/#meldingen') + "'>bekijk</a>";
    b.querySelector("b").textContent = m.niveau === "urgent" ? "Urgent:" : (m.bron === "aankondiging" ? "Straks:" : "Belangrijk:");
    b.querySelector("span").textContent = m.titel;
    if ("Notification" in window && Notification.permission === "granted") {
      new Notification("Buurmanitor: " + m.titel, { body: m.tekst || "", silent: m.niveau !== "urgent" && m.bron !== "aankondiging", tag: "bm-" + m.id });
    }
  }
  async function kijk() {
    try {
      const r = await fetch("/api/meldingen?na=" + na, { credentials: "same-origin" });
      if (!r.ok) return;
      const d = await r.json();
      if (!eerste) d.nieuw.forEach(toon);
      eerste = false; na = d.hoogste; sessionStorage.setItem("melding_na", na);
    } catch (e) { /* stil: volgende ronde opnieuw */ }
  }
  kijk(); setInterval(kijk, 30000);
})();
// Bureaubladmeldingen op Vandaag: laten zien of ze aan staan, aanzetten en een testmelding sturen.
(function () {
  const vak = document.getElementById("meldingstatus");
  if (!vak) return;
  const tekst = vak.querySelector(".tekst"), aan = document.getElementById("meldingen-aan"), test = document.getElementById("meldingen-test");
  const KAN = "Notification" in window && window.isSecureContext;
  function zeg(t) { tekst.textContent = t; }
  function teken() {
    if (!KAN) { zeg("Deze browser kan hier geen meldingen op je bureaublad geven."); aan.hidden = test.hidden = true; return; }
    const s = Notification.permission;
    zeg({granted: "Bureaubladmeldingen staan aan in deze browser.",
         denied: "Bureaubladmeldingen zijn geblokkeerd voor deze site. Klik op het slotje (of de schuifjes) links van het adres, zet Meldingen op Toestaan en ververs de pagina.",
         default: "Bureaubladmeldingen staan nog niet aan in deze browser."}[s] || s);
    aan.hidden = s !== "default"; test.hidden = s !== "granted";
  }
  function vraag() {  // oudere Safari kent alleen de terugroep-vorm
    return new Promise(klaar => { const p = Notification.requestPermission(klaar); if (p && p.then) p.then(klaar); });
  }
  function testmelding() {
    try {
      const n = new Notification("Buurmanitor: testmelding", { body: "Zie je dit, dan werken de meldingen op je bureaublad.", tag: "bm-test" });
      n.onerror = () => zeg("De browser kon de testmelding niet tonen. Kijk bij de meldingsinstellingen van je computer.");
      zeg("Testmelding verstuurd. Zie je niets in een hoek van je scherm? Dan houdt je computer hem tegen: kijk of je browser " +
          "meldingen mag geven (Mac: Systeeminstellingen › Berichtgeving; Windows: Instellingen › Systeem › Meldingen) en of Niet storen of Focus uit staat.");
    } catch (e) {
      zeg("Deze browser kan op dit apparaat geen meldingen tonen vanaf een pagina (" + e.message + ").");
    }
  }
  aan.onclick = () => {
    zeg("Kies Toestaan in de vraag van je browser (meestal linksboven, bij de adresbalk).");
    const stil = setTimeout(() => zeg("Zie je geen vraag? Dan houdt de browser hem stil. Kijk in de adresbalk: staat daar een " +
      "belletje met een streep erdoor, klik erop en kies Toestaan. Anders: klik op het slotje links van het adres en zet Meldingen op Toestaan."), 2500);
    vraag().then(() => { clearTimeout(stil); teken(); if (Notification.permission === "granted") testmelding(); });
  };
  test.onclick = testmelding;
  teken();
  // Toestemming via het slotje veranderd? Dan meteen bijwerken.
  document.addEventListener("visibilitychange", () => { if (!document.hidden) teken(); });
  if (navigator.permissions && navigator.permissions.query) {
    navigator.permissions.query({ name: "notifications" }).then(p => { p.onchange = teken; }).catch(() => {});
  }
})();
</script>
</body>
</html>
