# Buurmanitor: de portal, als derde project naast de cockpit (Doellijn) en Promonitor.
# Staat na installatie in ~/buurmanitor/docker-compose.yml; de code in ~/buurmanitor/app.
# De database draait in de bestaande PostgreSQL 17 van de cockpit (database buurmanitor), dus geen extra database-container.
# Caddy en Authelia uit ~/cockpit bereiken de app via het netwerk van de cockpit (alias buurmanitor-app).
name: buurmanitor

services:
  app:
    build: ./app
    restart: unless-stopped
    # Zelfde uid als de gebruiker ubuntu, zodat de app de back-upmappen (rechten 700) kan lezen. Alleen lezen.
    user: "1000:1000"
    environment:
      DATABASE_URL: postgresql://buurmanitor:${BUURMANITOR_DB_PASSWORD}@cockpit-db-1/buurmanitor
      PORTAL_HOST: ${PORTAL_HOST}
      AUTH_URL: ${AUTH_URL}
      PROXY_GEHEIM: ${PROXY_GEHEIM:-}
      TOEGESTANE_HOSTS: ${TOEGESTANE_HOSTS:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MAANDPLAFOND_EUR: ${MAANDPLAFOND_EUR:-20}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      # Clara (fase 3): kluissleutel voor tokens en de eigen apps bij Google en Microsoft (deploy/clara.sh).
      KLUIS_SLEUTEL: ${KLUIS_SLEUTEL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MS_CLIENT_ID: ${MS_CLIENT_ID:-}
      MS_CLIENT_SECRET: ${MS_CLIENT_SECRET:-}
      ORS_API_KEY: ${ORS_API_KEY:-}
      GOOGLE_MAPS_KEY: ${GOOGLE_MAPS_KEY:-}
      # Werkruimte Politiek (Promonitor, fase 1). Leeg = nog niet overgestapt; de portal linkt dan naar Promonitor.
      # deploy/overstap-politiek.sh vult deze waarden vanuit ~/promonitor/.env.
      POLITIEK_DATABASE_URL: ${POLITIEK_DATABASE_URL:-}
      POLITIEK_PLANNER: ${POLITIEK_PLANNER:-0}
      POLITIEK_ANTHROPIC_API_KEY: ${POLITIEK_ANTHROPIC_API_KEY:-}
      POLITIEK_TELEGRAM_BOT_TOKEN: ${POLITIEK_TELEGRAM_BOT_TOKEN:-}
      POLITIEK_TELEGRAM_CHAT_ID: ${POLITIEK_TELEGRAM_CHAT_ID:-}
      POLITIEK_SMTP_HOST: ${POLITIEK_SMTP_HOST:-}
      POLITIEK_SMTP_PORT: ${POLITIEK_SMTP_PORT:-465}
      POLITIEK_SMTP_USER: ${POLITIEK_SMTP_USER:-}
      POLITIEK_SMTP_PASSWORD: ${POLITIEK_SMTP_PASSWORD:-}
      POLITIEK_MAIL_AAN: ${POLITIEK_MAIL_AAN:-}
      POLITIEK_MAIL_VAN: ${POLITIEK_MAIL_VAN:-}
      TZ: Europe/Amsterdam
    # Werkruimte ZEROHERO (de Doellijn, fase 2): alle ZEROHERO_-instellingen staan in zerohero.env (alleen leesbaar voor
    # jou). Leeg = nog niet overgestapt. deploy/overstap-zerohero.sh vult het bestand met de instellingen van de oude app.
    env_file:
      - path: zerohero.env
        required: false
    volumes:
      - ${HOME}/cockpit/backups:/backups/doellijn:ro
      - ${HOME}/promonitor/backups:/backups/promonitor:ro
      - ${HOME}/buurmanitor/backups:/backups/buurmanitor:ro
    networks:
      cockpit:
        aliases:
          - buurmanitor-app
          # Na de overstap van de Doellijn ook "cockpit-app", zodat n8n zonder aanpassing de portal bereikt.
          - ${ZEROHERO_ALIAS:-buurmanitor-reserve}

networks:
  cockpit:
    external: true
    name: ${COCKPIT_NETWERK}
